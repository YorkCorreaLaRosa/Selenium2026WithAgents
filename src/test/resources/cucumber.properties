cucumber.publish.quiet=true

# Paralelismo listo para activarse (requiere ThreadLocal<WebDriver>, ya implementado en Hooks).
# Se deja deshabilitado por defecto porque extentreports-cucumber7-adapter no está
# verificado con ejecucion concurrente de escenarios. Habilitar cuando se confirme.
cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=dynamic
